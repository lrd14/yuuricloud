# Builds yuuricloud for Android as an .apk to install directly ("Install unknown apps").
#
# The .apk is signed with the key in the ANDROID_KEYSTORE secret (a base64 .jks file; its password
# in ANDROID_KEYSTORE_PASSWORD, and the key's alias in ANDROID_KEY_ALIAS). Without those secrets
# each build gets a throwaway key, and Android then only installs a new build after the old one is
# uninstalled. The release workflow runs this and attaches the .apk to the release; run it by hand
# from the Actions tab to get the .apk on the run's page.
name: Android

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Attach the .apk to the release of this version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # no Rust cache: plugin build scripts (the yuuricloud:// links) must run for the fresh project
      - run: npm ci

      - name: Create the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npm run tauri android init -- --ci

      - name: App icon
        run: npm run tauri icon -- icon.png

      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npm run tauri android build -- --ci --apk --target aarch64 --target armv7

      - name: Sign
        id: apk
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          file="yuuricloud_${version}_android.apk"
          unsigned="$(find src-tauri/gen/android -name '*release*.apk' | head -n 1)"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > key.jks
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key"
            PASSWORD=throwaway ALIAS=yuuricloud
            keytool -genkeypair -keystore key.jks -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=yuuricloud"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$tools/zipalign" -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks key.jks --ks-pass "pass:$PASSWORD" --ks-key-alias "${ALIAS:-yuuricloud}" --out "$file" aligned.apk
          rm key.jks
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ steps.apk.outputs.file }}

      - name: Attach to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.apk.outputs.file }}
        run: gh release upload "v$(jq -r .version src-tauri/tauri.conf.json)" "$FILE" --clobber --repo "${{ github.repository }}"
