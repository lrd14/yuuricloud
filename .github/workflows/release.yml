# Builds yuuricloud for Windows, macOS and Linux and attaches the installers to a GitHub
# release. Runs when a version tag (like v0.1.0) is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      # With the TAURI_SIGNING_PRIVATE_KEY secret set, the build also makes signed update files and
      # a latest.json, which the app's "Install" button downloads from. Without it, the release is
      # made the same as before and the app sends people to the download page instead.
      - name: Make update files when there's a key to sign them
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this release can't be installed by the app's Install button"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: yuuricloud v__VERSION__
          releaseBody: |
            Downloads for each system are below.

            - **Windows**: `yuuricloud_x.y.z_x64-setup.exe` (or the `.msi`), or `x64-portable.exe` to run without installing. Windows may show a SmartScreen warning; click **More info → Run anyway**.
            - **macOS**: `aarch64.dmg` for Apple Silicon (M1 and newer), `x64.dmg` for Intel Macs. The app isn't signed, so the first time, right-click it and choose **Open**, or run `xattr -cr /Applications/yuuricloud.app`.
            - **Linux**: `.AppImage` (any distro), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora).
            - **iPhone and iPad**: `iOS-unsigned.ipa`. Install it with [AltStore](https://altstore.io) or [SideStore](https://sidestore.io), which sign it with your Apple ID. See the README for getting music and SoundCloud onto it.
            - **Android**: `android.apk` (64-bit phones). Allow "Install unknown apps" for your browser or file manager, then open it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bare exe runs without installing (needs WebView2, which Windows 10 and 11 ship with).
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          cp src-tauri/target/release/yuuricloud.exe "yuuricloud_${version}_x64-portable.exe"
          gh release upload "v$version" "yuuricloud_${version}_x64-portable.exe" --clobber

  # The iPhone and iPad .ipa, attached to the same release once the build jobs have made it.
  ios:
    needs: build
    uses: ./.github/workflows/ios.yml
    with:
      release: true

  # The Android .apk, attached the same way.
  android:
    needs: build
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      release: true

  # Publish the release only once every platform has uploaded its files. A failed phone build
  # doesn't hold back the computer versions.
  publish:
    needs: [build, ios, android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
