# Builds yuuricloud for Windows, macOS and Linux and attaches the installers to a GitHub
# release. Runs when a version tag (like v0.1.0) is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: yuuricloud v__VERSION__
          releaseBody: |
            Downloads for each system are below.

            - **Windows**: `yuuricloud_x.y.z_x64-setup.exe` (or the `.msi`), or `x64-portable.exe` to run without installing. Windows may show a SmartScreen warning; click **More info → Run anyway**.
            - **macOS**: `aarch64.dmg` for Apple Silicon (M1 and newer), `x64.dmg` for Intel Macs. The app isn't signed, so the first time, right-click it and choose **Open**, or run `xattr -cr /Applications/yuuricloud.app`.
            - **Linux**: `.AppImage` (any distro), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bare exe runs without installing (needs WebView2, which Windows 10 and 11 ship with).
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          cp src-tauri/target/release/yuuricloud.exe "yuuricloud_${version}_x64-portable.exe"
          gh release upload "v$version" "yuuricloud_${version}_x64-portable.exe" --clobber

  # Publish the release only once every platform has uploaded its files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
