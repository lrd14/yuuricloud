# Builds yuuricloud for iPhone and iPad as an unsigned .ipa. AltStore or SideStore sign it with your
# own Apple ID when they install it. The release workflow runs this and attaches the .ipa to the
# release; run it by hand from the Actions tab to get the .ipa as a download on the run's page.
name: iOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Attach the .ipa to the release of this version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ios:
    # GitHub's Xcode 27 machine (a preview for now), which has the Xcode versions with the iPhone Duo's SDK
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # Built with Xcode 27.2, the app fills the iPhone Duo's screens edge to edge instead of keeping
      # to the space beside the status bar. It's a release candidate on GitHub's machine for now.
      - name: Use Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # a new key whenever Xcode changes: cached builds remember the old Xcode's paths
          key: ios-xcode27.2

      - run: npm ci

      # Tauri makes the Xcode project with xcodegen
      - run: brew install xcodegen

      - name: Create the Xcode project
        run: npm run tauri ios init -- --ci

      # iOS icons can't be see-through, so the corners get the app's background color
      - name: App icon
        run: npm run tauri icon -- icon.png --ios-color "#101218"

      - name: Build
        run: npm run tauri ios build -- --ci --no-sign

      - name: Name the .ipa
        id: ipa
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          file="yuuricloud_${version}_iOS-unsigned.ipa"
          cp "$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)" "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ steps.ipa.outputs.file }}

      - name: Attach to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.ipa.outputs.file }}
        run: gh release upload "v$(jq -r .version src-tauri/tauri.conf.json)" "$FILE" --clobber --repo "${{ github.repository }}"
