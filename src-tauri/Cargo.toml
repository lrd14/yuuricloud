[package]
name = "yuuricloud"
version = "0.5.1"
description = "A small local music player"
edition = "2021"

[lib]
# iOS builds link the app as a static library; the `_lib` suffix keeps it from clashing with the
# desktop binary's name on Windows.
name = "yuuricloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
regex = "1"
tauri-plugin-opener = "2"
ureq = { version = "3", features = ["json"] }
md5 = "0.7"
discord-rich-presence = "1"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sha2 = "0.10"
getrandom = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The Soulseek client the iOS app has built in, since iOS can't run slskd.
soulseek-rs-lib = "19.1"

# Opens the app from the QR code a computer shows to sign this phone in to SoundCloud.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-deep-link = "2"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# Decoding audio for waveforms is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
