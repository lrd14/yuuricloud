[package]
name = "yuuricloud"
version = "0.1.0"
description = "A small local music player"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
regex = "1"
tauri-plugin-opener = "2"
ureq = { version = "3", features = ["json"] }
md5 = "0.7"
discord-rich-presence = "1"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sha2 = "0.10"
getrandom = "0.3"


[profile.release]
codegen-units = 1
lto = true
strip = true

# Decoding audio for waveforms is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
